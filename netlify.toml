# Netlify: LeadOrbit frontend (static files, free plan).
# Set the API_BASE_URL environment variable in Netlify to your backend,
# e.g. https://leadorbit.onrender.com/api/v1
[build]
  base = "frontend"
  publish = "."
  command = """
    rm -f *.log
    if [ -n "$API_BASE_URL" ]; then
      printf "export const API_BASE_OVERRIDE = '%s';\\n" "$API_BASE_URL" > runtime-config.js
    fi
  """

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
