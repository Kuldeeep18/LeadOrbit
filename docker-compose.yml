# LeadOrbit Full-Stack Development Setup (Docker Compose)
# Usage:
#   docker compose up --build
# Or with background services:
#   docker compose up -d --build
name: leadorbit-dev

x-backend: &backend
  build:
    context: .
    dockerfile: deploy/backend.Dockerfile
  image: leadorbit-backend:dev
  env_file:
    - path: .env
      required: false
  environment:
    DEBUG: "True"
    SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-change-in-production}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,web}
    BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:8000}
    FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
    AI_PROVIDER: ${AI_PROVIDER:-none}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    CRON_SECRET: ${CRON_SECRET:-}
    ENABLE_AUTO_REPLY_DETECTION: ${ENABLE_AUTO_REPLY_DETECTION:-false}
    ENABLE_AUTO_BOUNCE_DETECTION: ${ENABLE_AUTO_BOUNCE_DETECTION:-true}
    LAUNCH_IMMEDIATE_PASSES: ${LAUNCH_IMMEDIATE_PASSES:-1}
  volumes:
    - ./backend:/app:rw
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    <<: *backend
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,urllib.error\ntry: urllib.request.urlopen('http://127.0.0.1:8000/api/v1/', timeout=5)\nexcept urllib.error.HTTPError: pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *backend
    command: ["celery", "-A", "backend", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  beat:
    <<: *backend
    command: ["celery", "-A", "backend", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    image: python:3.11-alpine
    working_dir: /srv/frontend
    command: ["python", "-m", "http.server", "8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/srv/frontend:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redisdata:
