{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container-fluid">
  <!-- Existing campaign builder content here -->
  <!-- … -->

  <!-- Merge Tag Validation Warning Modal -->
  <div class="modal" id="merge-tag-warning-modal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Missing Merge Data</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <p id="merge-warning-message"></p>
          <ul id="missing-fields-list"></ul>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="review-leads-btn">Review Leads</button>
          <button type="button" class="btn btn-primary" id="launch-anyway-btn">Launch Anyway</button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  // Launch button click handler
  document.getElementById('launch-campaign-btn').addEventListener('click', async function(e) {
    e.preventDefault();
    const campaignId = document.getElementById('campaign-id').value;
    try {
      const response = await fetch(`/api/v1/campaigns/${campaignId}/validate-launch/`);
      const data = await response.json();
      if (data.can_launch) {
        // All good, submit launch
        document.getElementById('campaign-form').submit();
      } else {
        // Show warning modal
        document.getElementById('merge-warning-message').textContent = data.message;
        const list = document.getElementById('missing-fields-list');
        list.innerHTML = '';
        for (const [field, leadIds] of Object.entries(data.missing_fields)) {
          const li = document.createElement('li');
          li.textContent = `${field}: ${leadIds.length} leads`;
          list.appendChild(li);
        }
        $('#merge-tag-warning-modal').modal('show');
      }
    } catch (err) {
      console.error('Validation error:', err);
      alert('Could not validate launch. Please try again.');
    }
  });

  // Modal action buttons
  document.getElementById('review-leads-btn').addEventListener('click', function() {
    $('#merge-tag-warning-modal').modal('hide');
    // Optionally scroll to leads section or filter incomplete leads
    // (further implementation depends on existing UI)
  });

  document.getElementById('launch-anyway-btn').addEventListener('click', function() {
    $('#merge-tag-warning-modal').modal('hide');
    document.getElementById('campaign-form').submit();
  });
</script>
{% endblock %}
