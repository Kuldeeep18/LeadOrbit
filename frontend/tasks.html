<!DOCTYPE html>
<html lang="en">
<head>
    <!-- SEO Meta Tags -->
    <title>LeadOrbit - Tasks</title>
    <meta name="description" content="LeadOrbit - Tasks. Complete manual tasks for your campaigns.">
    <meta name="keywords" content="lead management, outreach, CRM, dashboard, analytics, tasks">
    <meta name="author" content="LeadOrbit Team">
    <meta property="og:title" content="LeadOrbit - Tasks">
    <meta property="og:description" content="Track your campaigns, leads, and engagement metrics in LeadOrbit dashboard.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="LeadOrbit">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="LeadOrbit - Tasks">
    <meta name="twitter:description" content="LeadOrbit tasks - Complete your campaign tasks.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./theme-boot.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="./theme.css" rel="stylesheet">
</head>
<body>
    <div id="sidebar-overlay"></div>
    <div class="app-shell">
        <aside class="sidebar" role="navigation" aria-label="Main navigation">
            <div class="d-flex align-items-center mb-4 mt-2">
                <div class="brand">LeadOrbit</div>
            </div>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item mb-2">
                    <a href="/dashboard.html" class="nav-link d-flex align-items-center">
                        <i class="bi bi-grid-1x2 me-2" aria-hidden="true"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a href="/leads.html" class="nav-link d-flex align-items-center">
                        <i class="bi bi-people me-2" aria-hidden="true"></i> Leads
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a href="/campaigns.html" class="nav-link d-flex align-items-center">
                        <i class="bi bi-megaphone me-2" aria-hidden="true"></i> Campaigns
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a href="/analytics.html" class="nav-link d-flex align-items-center">
                        <i class="bi bi-bar-chart-line me-2" aria-hidden="true"></i> Analytics
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a href="/settings.html" class="nav-link d-flex align-items-center">
                        <i class="bi bi-gear me-2" aria-hidden="true"></i> Settings
                    </a>
                </li>
                <li class="nav-item mb-2">
                    <a href="/tasks.html" class="nav-link active d-flex align-items-center">
                        <i class="bi bi-check-square me-2" aria-hidden="true"></i> Tasks
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer small">
                <span class="text-white opacity-75 user-display-name">Loading...</span>
            </div>
        </aside>

        <main class="main-area">
            <header class="top-header">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                    <button id="hamburger-btn" class="btn d-lg-none p-1" aria-label="Toggle menu">
                        <i class="bi bi-list fs-4" aria-hidden="true"></i>
                    </button>
                    <div>
                        <div class="page-title">Tasks</div>
                        <div class="title-meta">Complete manual steps for your leads to resume campaigns.</div>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button id="logout-btn" class="btn btn-sm btn-logout" aria-label="Log out">Logout</button>
                    </div>
                </div>
            </header>
            
            <nav aria-label="breadcrumb" class="mt-2 px-3">
                <ol class="breadcrumb small">
                <li class="breadcrumb-item active" aria-current="page">
                    Tasks
                </li>
                </ol>
            </nav>

            <section class="content-wrap">
                <div class="card card-custom">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table mb-0 align-middle">
                                <thead>
                                    <tr>
                                        <th>Lead</th>
                                        <th>Campaign</th>
                                        <th>Task Type</th>
                                        <th>Description</th>
                                        <th>Status</th>
                                        <th class="text-end">Action</th>
                                    </tr>
                                </thead>
                                <tbody id="tasks-tbody">
                                    <tr>
                                        <td colspan="6" class="text-center py-4 text-muted">Loading tasks...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { fetchWithAuth } from './api.js';

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const data = await fetchWithAuth('/manual-tasks/');
                const tbody = document.getElementById('tasks-tbody');
                
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No pending tasks found.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(task => `
                    <tr>
                        <td class="fw-medium">${task.lead_name || ''} <span class="text-muted d-block small">${task.lead_email}</span></td>
                        <td>${task.campaign_name}</td>
                        <td><span class="badge bg-secondary">${task.task_type}</span></td>
                        <td><small>${task.description || '-'}</small></td>
                        <td><span class="badge ${task.status === 'PENDING' ? 'bg-warning' : 'bg-success'}">${task.status}</span></td>
                        <td class="text-end">
                            ${task.status === 'PENDING' ? `<button class="btn btn-sm btn-primary complete-task-btn" data-id="${task.id}">Mark Complete</button>` : ''}
                        </td>
                    </tr>
                `).join('');
                
                document.querySelectorAll('.complete-task-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const taskId = e.target.getAttribute('data-id');
                        try {
                            e.target.disabled = true;
                            e.target.textContent = 'Completing...';
                            await fetchWithAuth(`/manual-tasks/${taskId}/complete/`, { method: 'POST' });
                            e.target.closest('tr').querySelector('td:nth-child(5)').innerHTML = '<span class="badge bg-success">COMPLETED</span>';
                            e.target.remove();
                        } catch (err) {
                            console.error(err);
                            alert('Failed to complete task');
                            e.target.disabled = false;
                            e.target.textContent = 'Mark Complete';
                        }
                    });
                });
            } catch (err) {
                console.error(err);
                document.getElementById('tasks-tbody').innerHTML = '<tr><td colspan="6" class="text-center py-4 text-danger">Failed to load tasks</td></tr>';
            }
        });
    </script>
    <script type="module" src="./main.js"></script>
</body>
</html>
