<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/theme-boot.js"></script>
    <!-- Clean Page Title -->
    <title>Register - LeadOrbit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Loaded Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Loaded Google Fonts (Manrope + Sora) -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="/theme.css" rel="stylesheet">

    <!-- Shared theme overrides for complete UI consistency -->
    <style>
        body.auth-page {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) !important;
            font-family: 'Manrope', sans-serif;
        }
        .custom-glass-card {
            background: rgba(30, 41, 59, 0.7) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 20px;
        }
        .brand-gradient {
            background: linear-gradient(45deg, #00b4db, #00ffca) !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            color: transparent !important;
            display: inline-block;
        }
        .custom-input {
            background-color: rgba(15, 23, 42, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #ffffff !important;
        }
        .custom-input:focus {
            background-color: rgba(15, 23, 42, 0.8) !important;
            border-color: #00b4db !important;
            box-shadow: 0 0 0 0.25rem rgba(0, 180, 219, 0.25) !important;
            color: #ffffff !important;
        }
        .input-group-text-custom {
            background-color: rgba(15, 23, 42, 0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-right: none !important;
            color: rgba(255, 255, 255, 0.5) !important;
        }
    </style>
</head>

<body class="auth-page d-flex align-items-center min-vh-100">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <!-- Applied our custom glass style container -->
                <div class="custom-glass-card p-4 shadow-lg">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <h2 class="brand-gradient mb-1" style="font-family: 'Sora', sans-serif; font-weight: 800; font-size: 2.5rem;">LeadOrbit</h2>
                            <p class="text-white-50 small">Create your account to get started.</p>
                        </div>

                        <form novalidate>
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label for="firstName" class="form-label text-white-50 small fw-semibold">First Name</label>
                                    <div class="input-group has-validation">
                                        <span class="input-group-text  input-group-text-custom"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control form-control-lg fs-6 custom-input" id="firstName"
                                            placeholder="Jane" required style="border-left: none !important;">
                                        <div class="invalid-feedback">First name is required.</div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <label for="lastName" class="form-label text-white-50 small fw-semibold">Last Name</label>
                                    <div class="input-group has-validation">
                                        <span class="input-group-text input-group-text-custom"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control form-control-lg fs-6 custom-input" id="lastName"
                                            placeholder="Doe" required style="border-left: none !important;">
                                        <div class="invalid-feedback">Last name is required.</div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="emailAddress" class="form-label text-white-50 small fw-semibold">Email Address</label>
                                <div class="input-group has-validation">
                                    <span class="input-group-text input-group-text-custom"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control form-control-lg fs-6 custom-input" id="emailAddress"
                                        placeholder="name@example.com" required style="border-left: none !important;">
                                    <div class="invalid-feedback">Please enter a valid email address.</div>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label text-muted small fw-semibold">Password</label>
                                <div class="password-toggle-wrapper has-validation">
                                    <input type="password" class="form-control form-control-lg fs-6 custom-input" id="password"
                                        placeholder="Min. 8 characters" required>
                                    <button type="button" id="passwordToggle" class="password-toggle-btn" aria-label="Show password">👁</button>
                                    <div class="invalid-feedback">Password must be at least 8 characters with upper, lower, and numbers.</div>
                                </div>
                                <div class="mt-2" id="passwordStrengthIndicator" style="display: none;">
                                    <div class="progress" style="height: 5px; background-color: rgba(255,255,255,0.1);">
                                        <div id="passwordStrengthBar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                                    </div>
                                    <small id="passwordStrengthText" class="text-muted mt-1 d-block"></small>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label text-muted small fw-semibold">Confirm Password</label>
                                <div class="password-toggle-wrapper has-validation">
                                    <input type="password" class="form-control form-control-lg fs-6 custom-input" id="confirmPassword"
                                        placeholder="Confirm your password" required>
                                    <div class="invalid-feedback">Passwords do not match.</div>
                                </div>
                            </div>

                            <div class="d-grid mb-3">
                                <button class="btn btn-lg fw-semibold text-dark" style="background: linear-gradient(45deg, #00b4db, #00ffca); border: none;" type="submit">Sign Up</button>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0 small text-white-50">Already have an account? <a href="/login.html"
                                    class="text-decoration-none fw-semibold" style="color: #00ffca;">Sign in</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/main.js"></script>
    <script type="module">
        import { register } from '/api.js';
        import { showToast } from '/toast.js';

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const firstNameInput = document.getElementById('firstName');
            const lastNameInput = document.getElementById('lastName');
            const emailInput = document.getElementById('emailAddress');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            
            const passwordStrengthIndicator = document.getElementById('passwordStrengthIndicator');
            const passwordStrengthBar = document.getElementById('passwordStrengthBar');
            const passwordStrengthText = document.getElementById('passwordStrengthText');

            // Regex patterns
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const hasUpper = /[A-Z]/;
            const hasLower = /[a-z]/;
            const hasNumber = /\d/;

            function validateEmail() {
                const isValid = emailRegex.test(emailInput.value);
                if (emailInput.value.length > 0) {
                    if (isValid) {
                        emailInput.classList.remove('is-invalid');
                        emailInput.classList.add('is-valid');
                    } else {
                        emailInput.classList.remove('is-valid');
                        emailInput.classList.add('is-invalid');
                    }
                } else {
                    emailInput.classList.remove('is-valid', 'is-invalid');
                }
                return isValid;
            }

            function validatePassword() {
                const val = passwordInput.value;
                let strength = 0;
                let isValid = false;

                if (val.length >= 8) strength += 25;
                if (hasUpper.test(val)) strength += 25;
                if (hasLower.test(val)) strength += 25;
                if (hasNumber.test(val)) strength += 25;

                if (val.length > 0) {
                    passwordStrengthIndicator.style.display = 'block';
                    passwordStrengthBar.style.width = strength + '%';

                    if (strength <= 50) {
                        passwordStrengthBar.className = 'progress-bar bg-danger';
                        passwordStrengthText.textContent = 'Weak';
                        passwordStrengthText.className = 'text-danger mt-1 d-block small fw-semibold';
                        isValid = false;
                    } else if (strength === 75) {
                        passwordStrengthBar.className = 'progress-bar bg-warning';
                        passwordStrengthText.textContent = 'Medium';
                        passwordStrengthText.className = 'text-warning mt-1 d-block small fw-semibold';
                        isValid = false;
                    } else if (strength === 100) {
                        passwordStrengthBar.className = 'progress-bar bg-success';
                        passwordStrengthText.textContent = 'Strong';
                        passwordStrengthText.className = 'text-success mt-1 d-block small fw-semibold';
                        isValid = true;
                    }

                    if (isValid) {
                        passwordInput.classList.remove('is-invalid');
                        passwordInput.classList.add('is-valid');
                    } else {
                        passwordInput.classList.remove('is-valid');
                        passwordInput.classList.add('is-invalid');
                    }
                } else {
                    passwordStrengthIndicator.style.display = 'none';
                    passwordInput.classList.remove('is-valid', 'is-invalid');
                }
                
                if (confirmPasswordInput.value.length > 0) {
                    validateConfirmPassword();
                }

                return isValid;
            }

            function validateConfirmPassword() {
                const isValid = confirmPasswordInput.value === passwordInput.value && confirmPasswordInput.value.length > 0;
                if (confirmPasswordInput.value.length > 0) {
                    if (isValid) {
                        confirmPasswordInput.classList.remove('is-invalid');
                        confirmPasswordInput.classList.add('is-valid');
                    } else {
                        confirmPasswordInput.classList.remove('is-valid');
                        confirmPasswordInput.classList.add('is-invalid');
                    }
                } else {
                    confirmPasswordInput.classList.remove('is-valid', 'is-invalid');
                }
                return isValid;
            }

            function validateRequired(input) {
                const isValid = input.value.trim().length > 0;
                if (input.value.length > 0) {
                    if (isValid) {
                        input.classList.remove('is-invalid');
                        input.classList.add('is-valid');
                    } else {
                        input.classList.remove('is-valid');
                        input.classList.add('is-invalid');
                    }
                }
                return isValid;
            }

            emailInput.addEventListener('input', validateEmail);
            passwordInput.addEventListener('input', validatePassword);
            confirmPasswordInput.addEventListener('input', validateConfirmPassword);
            firstNameInput.addEventListener('input', () => validateRequired(firstNameInput));
            lastNameInput.addEventListener('input', () => validateRequired(lastNameInput));

            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const isFirstNameValid = validateRequired(firstNameInput);
                    const isLastNameValid = validateRequired(lastNameInput);
                    const isEmailValid = validateEmail();
                    const isPasswordValid = validatePassword();
                    const isConfirmPasswordValid = validateConfirmPassword();

                    if (!isFirstNameValid || !isLastNameValid || !isEmailValid || !isPasswordValid || !isConfirmPasswordValid) {
                        if (!isFirstNameValid) firstNameInput.classList.add('is-invalid');
                        if (!isLastNameValid) lastNameInput.classList.add('is-invalid');
                        if (!isEmailValid && emailInput.value.length === 0) emailInput.classList.add('is-invalid');
                        if (!isPasswordValid && passwordInput.value.length === 0) passwordInput.classList.add('is-invalid');
                        if (!isConfirmPasswordValid && confirmPasswordInput.value.length === 0) confirmPasswordInput.classList.add('is-invalid');
                        return;
                    }

                    const first_name = firstNameInput.value;
                    const last_name = lastNameInput.value;
                    const email = emailInput.value;
                    const password = passwordInput.value;

                    const organization_name = first_name + "'s Organization";

                    try {
                        const btn = form.querySelector('button[type="submit"]');
                        btn.disabled = true;
                        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Signing up...';

                        await register({
                            first_name, last_name, email, password, organization_name
                        });

                        window.location.href = '/dashboard.html';
                    } catch (err) {
                        showToast('Registration failed. Please try again.', 'error');
                        const btn = form.querySelector('button[type="submit"]');
                        btn.disabled = false;
                        btn.textContent = 'Sign Up';
                    }
                });
            }
        });
    </script>
</body>

</html>
