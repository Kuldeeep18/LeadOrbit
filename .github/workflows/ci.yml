name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel in-progress runs for the same PR to save action minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Follow principle of least privilege
permissions:
  contents: read

jobs:
  quality-checks:
    name: Conflict Markers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Check for merge conflict markers
        run: |
          if grep -rn --exclude-dir=.git -E "^<<<<<<< |^=======|^>>>>>>> " .; then
            echo "Unresolved merge conflict markers found!"
            exit 1
          fi

  lint:
    name: Ruff Lint
    needs: quality-checks # Only run if quality checks pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          
      - name: Lint with Ruff
        run: ruff check .

  test-backend:
    name: Backend Tests
    needs: quality-checks # Only run if quality checks pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Django Tests
        run: |
          cd backend
          python manage.py test
