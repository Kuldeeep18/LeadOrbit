name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check and backend tests
        working-directory: backend
        env:
          DEBUG: "True"
          SECRET_KEY: "ci-test-secret-key"
          CELERY_TASK_ALWAYS_EAGER: "true"
          AI_PROVIDER: "none"
        run: |
          python manage.py check
          python manage.py test

      - name: Run automation script unit tests
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v

  frontend-checks:
    name: frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check frontend JavaScript syntax
        run: |
          for file in frontend/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
